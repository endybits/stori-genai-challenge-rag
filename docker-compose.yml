services:
  ingest:
    build: .
    image: stori-rag:latest
    command: ["ingest"]
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?GOOGLE_API_KEY is not set}
    volumes:
      - rag_index:/app/chroma_db
      - rag_parents:/app/parent_doc_store
      - rag_state:/app/agent_db
    restart: "no"

  rag:
    build: .
    image: stori-rag:latest
    command: ["serve"]
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?GOOGLE_API_KEY is not set}
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - rag_index:/app/chroma_db
      - rag_parents:/app/parent_doc_store
      - rag_state:/app/agent_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  rag_index:
  rag_parents:
  rag_state: